<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 100"><style>@keyframes lookAround{0%,to{transform:translateX(-18px)}50%{transform:translateX(18px)}}.eye-frame-black,.eye-frame-white{fill:#fff;stroke:#fff;stroke-width:6;stroke-linejoin:round}.eye-frame-black{stroke:#000;stroke-width:3}</style><g id="eyes-container"><ellipse cx="90" cy="50" class="eye-frame-white" rx="40" ry="25"/><ellipse cx="90" cy="50" class="eye-frame-black" rx="40" ry="25"/><ellipse cx="210" cy="50" class="eye-frame-white" rx="40" ry="25"/><ellipse cx="210" cy="50" class="eye-frame-black" rx="40" ry="25"/><g style="animation:lookAround 2.5s ease-in-out infinite alternate"><circle cx="90" cy="50" r="14"/><circle cx="85" cy="45" r="4" fill="#fff"/><circle cx="210" cy="50" r="14"/><circle cx="205" cy="45" r="4" fill="#fff"/></g></g></svg>